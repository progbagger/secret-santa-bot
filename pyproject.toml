[project]
name = "secret-santa-bot"
version = "0.1.0"
description = "Telegram bot for creating secret santa sessions"
readme = "README.md"
authors = [{ name = "d.astakhov", email = "d.astakhov@cian.ru" }]
requires-python = ">=3.13"
dependencies = ["asyncpg>=0.31.0", "sqlalchemy[asyncio]>=2.0.46"]

[project.scripts]
secret-santa-bot = "secret_santa_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
