[project]
name = "secret-santa-bot"
version = "0.1.0"
description = "Telegram bot for running Secret Santa games in group chats."
readme = "README.md"
authors = [
    { name = "Danil Astakhov", email = "75833312+progbagger@users.noreply.github.com" }
]
requires-python = ">=3.14.4"
dependencies = [
    "aiogram>=3.30.0",
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[project.scripts]
secret-santa-bot = "secret_santa_bot:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/secret_santa_bot"]

[tool.mypy]
exclude = ["^alembic/"]

[dependency-groups]
migration = [
    "alembic>=1.17.2",
]
dev = [
    "dotenv>=0.9.9",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pyhamcrest>=2.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.2",
]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "misc"]
